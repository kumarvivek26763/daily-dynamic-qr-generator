    <circle cx="94" cy="18" r="4.5" fill="#fafaf9" />
    <!-- Daily text "24" or calendar symbol -->
    <text x="65" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#1c1917" text-anchor="middle">24</text>
    <text x="65" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle" letter-spacing="1">DAILY</text>
