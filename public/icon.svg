  <rect x="96" y="308" width="108" height="108" rx="20" fill="none" stroke="#f59e0b" stroke-width="22" />
  <rect x="134" y="346" width="32" height="32" rx="8" fill="#f59e0b" />

  <!-- Center QR Matrix Elements -->
  <rect x="236" y="104" width="40" height="40" rx="8" fill="#fafaf9" />
  <rect x="236" y="164" width="40" height="40" rx="8" fill="#f59e0b" />
  <rect x="104" y="236" width="40" height="40" rx="8" fill="#fafaf9" />
  <rect x="164" y="236" width="40" height="40" rx="8" fill="#d97706" />
  <rect x="236" y="236" width="40" height="40" rx="8" fill="#fafaf9" />
  <rect x="308" y="236" width="40" height="40" rx="8" fill="#f59e0b" />
  <rect x="368" y="236" width="48" height="40" rx="8" fill="#fafaf9" />
  
  <rect x="236" y="308" width="40" height="40" rx="8" fill="#f59e0b" />
  <rect x="236" y="368" width="40" height="48" rx="8" fill="#fafaf9" />

  <!-- Bottom-Right Dynamic Daily Calendar Badge -->
  <g transform="translate(296, 296)">
    <rect width="130" height="130" rx="24" fill="#fafaf9" stroke="#d97706" stroke-width="6" />
    <path d="M 0 24 C 0 10.7 10.7 0 24 0 L 106 0 C 119.3 0 130 10.7 130 24 L 130 38 L 0 38 Z" fill="#d97706" />
